<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION Trading Intelligence</title>
    <meta http-equiv="refresh" content="0; url=./docs/index.html">
    <link rel="canonical" href="./docs/index.html">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .wrap {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .glyph {
            font-size: 44px;
            line-height: 1;
            margin-bottom: 18px;
            color: #e6b800;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: .4px;
            color: #e6b800;
        }
        p {
            margin: 0 0 22px;
            color: #8b949e;
            font-size: 14px;
        }
        a.enter {
            display: inline-block;
            padding: 11px 26px;
            border: 1px solid #e6b800;
            border-radius: 6px;
            color: #e6b800;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background .18s ease, color .18s ease;
        }
        a.enter:hover {
            background: #e6b800;
            color: #0d1117;
        }
        .foot {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #484f58;
            letter-spacing: .5px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="glyph">&#9889;</div>
        <h1>ZION Trading Intelligence</h1>
        <p>Cargando el reporte de la Bestia&hellip;</p>
        <a class="enter" href="./docs/index.html">Entrar al reporte</a>
    </div>
    <div class="foot">ZION Systems &middot; Generado por la Bestia</div>
</body>
</html>
